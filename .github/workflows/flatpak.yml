name: flatpak

# Builds the Flatpak so it can be tested and installed by hand. NOTHING is published: no tag trigger,
# no release asset, no Pages repository, no store submission. Run it from the Actions tab with
# "Run workflow"; the bundle comes back as a workflow artifact you can download and
# `flatpak install ./quixidesk.flatpak`.
#
# To publish later, three things have to exist first and none of them do: a signing key in repository
# secrets, a public (or paid-plan) host for the OSTree repository, and a Flathub submission that has
# passed review.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Build volkdude85's QuixiCore
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: quixidesk.flatpak
          manifest-path: flatpak/org.quixidesk.QuixiDesk.yml
          cache-key: flatpak-org-quixidesk-QuixiDesk-${{ github.sha }}
          run-tests: false

      - name: Keep the bundle as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: quixidesk-bundle
          path: quixidesk.flatpak
          retention-days: 30
