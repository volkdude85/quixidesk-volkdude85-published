name: flatpak

# Builds the Flatpak on a tag and attaches the bundle to the release, so a Deck or Debian user can
# `flatpak install ./quixidesk.flatpak` without a store review. Also runs on demand: a packaging job
# that only fires at release time is a packaging job nobody has tested.
#
# What is deliberately NOT here yet, and why:
#  * publishing an OSTree repository to GitHub Pages — Pages for a private repository needs a paid
#    plan, and flatpak refuses an unsigned repository without --no-gpg-verify. Both are fixable
#    (sign with a key in secrets, publish from the public repo or a paid plan); neither is worth
#    pretending is done.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Build the bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: quixidesk.flatpak
          manifest-path: flatpak/org.quixidesk.QuixiDesk.yml
          cache-key: flatpak-quixidesk-${{ github.sha }}
          run-tests: false

      - name: Attach the bundle to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: quixidesk.flatpak

      - name: Keep the bundle as a workflow artifact too
        uses: actions/upload-artifact@v4
        with:
          name: quixidesk-flatpak
          path: quixidesk.flatpak
          retention-days: 30
