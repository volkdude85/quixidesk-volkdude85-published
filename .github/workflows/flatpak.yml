name: flatpak

# Builds the Flatpak from the repository on every push, and on demand. The bundle is attached to the run
# as an artifact, so "the Flatpak" means the newest green run on master and nothing else — it cannot drift
# away from the source, because the source is what built it.
#
# This workflow publishes nothing. It builds the bundle and attaches it to the run as an artifact.
#
# The public install channel is separate and manual: `flatpak/build-flatpak.sh` builds a signed OSTree
# repository under ~/flatpak-build/repo, and that directory is rsynced onto the `gh-pages` branch, which
# GitHub Pages serves at
#
#   https://volkdude85.github.io/quixidesk-volkdude85-published/
#
# So the thing a person installs is NOT whatever CI last produced — it is whatever was pushed to
# `gh-pages` by hand. If the two disagree, `gh-pages` is the one that is live, and the ref that matters is
# `repo/refs/heads/app/org.quixidesk.QuixiDesk/x86_64/master`. Check it before telling anyone an install
# line is current.
#
# Nothing goes to Flathub: that submission needs source builds and the org.quixidesk namespace is Eric's.
on:
  push:
    branches: [master]
  workflow_dispatch:

# One build per ref. Without this, every push in a burst starts its own full run and the
# failing ones still burn their full seven minutes before dying.
concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Not in the flathub build container. That image carries the SDK but not the host-side libraries a
    # normal cargo build needs (javascriptcoregtk-4.1 and friends), and its filesystem had 894 MB free
    # against a 1.7 GB dependency delta. The action below installs flatpak and the runtime itself, so
    # the job runs where the disk and the toolchain both exist.
    runs-on: ubuntu-latest
    # A hung flatpak-builder would otherwise sit on the 6-hour default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The runner image carries toolchains this build never touches, and the GNOME SDK plus the
      # application's build dependencies need more room than the default free space leaves.
      - name: Free disk space
        run: |
          set -e
          for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/powershell; do
            [ -d "$d" ] && rm -rf "$d" || true
          done
          df -h / | tail -1

      # What the application links against. This is a Tauri-shaped Rust desktop app: webkit2gtk,
      # gtk3, and the tray/indicator libraries. Without these the cargo build dies in
      # javascriptcore-rs-sys looking for a .pc file.
      - name: Install the libraries the binary links against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev patchelf \
            flatpak flatpak-builder elfutils
          # The action calls flatpak-builder and installs dependencies from a remote named flathub; on a
          # plain runner neither exists until they are put there, and the action runs `flatpak --system
          # install` as the runner user, which the system helper refuses ("Deploy not allowed for user").
          # So the runtime and SDK go in here, as root, before the action looks for them.
          #
          # The version comes from the MANIFEST, never a second copy of it here. This step used to say
          # //50 while the manifest said 51, so the action found 50, asked for 51, tried to install it as
          # a user, and died on the system helper — 32 red runs in a row, every one of them the same
          # error, none of them visible without opening the log.
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          RUNTIME=$(sed -n 's/^runtime-version:[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}[[:space:]]*$/\1/p' \
            flatpak/org.quixidesk.QuixiDesk.yml)
          [ -n "$RUNTIME" ] || { echo "could not read runtime-version from the manifest" >&2; exit 1; }
          echo "runtime branch: $RUNTIME"
          sudo flatpak install -y --noninteractive --system flathub \
            "org.gnome.Platform//$RUNTIME" "org.gnome.Sdk//$RUNTIME"
          flatpak --version
          flatpak-builder --version

      # The manifest sources the application tree, and a checkout of this repository does not contain one:
      # the repository carries the patch series, so this turns the series into a tree. Same order as
      # prepare(), because that order is what ships.
      # The binary is compiled here, on the runner, and handed to the manifest as a prebuilt file. The
      # Rust SDK extension would be the only reason to compile inside the sandbox, and installing it
      # needs 1.7 GB of delta space that this container does not have. A packager that compiles is a
      # packager that can fail on a toolchain; this one should only be able to fail on packaging.
      - name: Make sure cargo exists on the runner
        run: |
          set -e
          command -v cargo >/dev/null 2>&1 && exit 0
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Prepare the source tree from the patch series
        run: |
          set -e
          pkgver=$(sed -n 's/^pkgver=//p' PKGBUILD)
          curl -sSL -o "/tmp/QuixiDesk-${pkgver}.tar.gz" \
            "https://github.com/QuixiAI/QuixiDesk/archive/refs/tags/v${pkgver}.tar.gz"
          mkdir -p src
          tar xzf "/tmp/QuixiDesk-${pkgver}.tar.gz" -C /tmp
          mv "/tmp/QuixiDesk-${pkgver}" flatpak-src
          cd flatpak-src
          for p in $(sed -n '/^prepare()/,/^build()/p' ../PKGBUILD \
                       | grep -oE '[0-9]{4}-[a-z0-9-]+\.patch' | awk '!seen[$0]++'); do
            path=$(find ../patches -name "$p" | head -1)
            patch -Np1 -s -i "$path"
          done
          # No sandbox compile, so no vendored registry: cargo fetches the locked crates here, where
          # there is a network, and the tree carries the finished binary.
          echo "== building the binary on the runner"
          cargo build --release -p quixi-app
          mkdir -p prebuilt
          cp target/release/QuixiDesk prebuilt/QuixiDesk
          ls -l prebuilt/QuixiDesk
          # The packaging files live in this repository, not in the application tree, so the manifest
          # cannot find its desktop entry, its metainfo or its launcher without them being put there.
          cd ..
          cp -a flatpak flatpak-src/flatpak
          ls -l flatpak-src/flatpak

      - name: Import the release signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          set -e
          printf '%s' "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
          gpg --list-secret-keys --with-colons | awk -F: '/^sec:/{print "key", $5}'

      - name: Build volkdude85's QuixiCore
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: quixidesk.flatpak
          manifest-path: flatpak/org.quixidesk.QuixiDesk.yml
          # The action's own cache is OFF, and that is a correctness choice, not a speed one.
          #
          # (a) A cache key that contains the commit can never be restored — the action's maintainers
          #     say so themselves: "It changes with every commit so nothing will get restored ever."
          #     (upstream PR #261, closing issue #239). Every run logged "No cache was found" and then
          #     uploaded a cache nothing would read.
          # (b) A cache key that does NOT contain the commit is worse. The local builder
          #     (flatpak/build-flatpak.sh) carries the scar: a cache hit packaged the PREVIOUS export
          #     while the new files sat in the archive beside it, and the build reported success.
          #
          # So no cache. The GNOME SDK is installed above anyway; what is being rebuilt here is one
          # module that installs five files.
          cache: false
          # Signed with the same key the published repository is signed with, so the bundle and the
          # repository agree and a machine that already trusts the remote will accept the file.
          gpg-sign: ${{ secrets.FLATPAK_GPG_KEY_ID }}
          run-tests: false

      # The linter Flathub itself runs on every build: four checks (appstream, manifest, builddir,
      # repo) from ghcr.io/flathub/flatpak-builder-lint. Our CI image is built FROM that same image,
      # so this is the check and not an imitation of it.
      #
      # Non-blocking on purpose, today: our metainfo has one appstream warning
      # (url-homepage-missing) and appstreamcli treats warnings as fatal. Turning it blocking now
      # would just paint the build red for a metadata field. Fix the metainfo, then delete
      # continue-on-error — the comment says so out loud so it does not become permanent.
      - name: Lint the manifest and the metainfo
        continue-on-error: true
        run: |
          set -e
          docker run --rm -v "$PWD:/mnt" ghcr.io/flathub/flatpak-builder-lint:latest \
            manifest /mnt/flatpak/org.quixidesk.QuixiDesk.yml || true
          docker run --rm -v "$PWD:/mnt" ghcr.io/flathub/flatpak-builder-lint:latest \
            appstream /mnt/flatpak/org.quixidesk.QuixiDesk.metainfo.xml || true

      - name: Keep the bundle as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: quixidesk-bundle-${{ github.sha }}
          path: quixidesk.flatpak
          retention-days: 30
